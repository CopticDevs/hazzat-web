# Node.js with React
# Build a Node.js project that uses React.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger: none

pr: none

pool:
  vmImage: 'ubuntu-26.04'

steps:
- task: UseNode@1
  inputs:
    version: '24.x'
  displayName: 'Install Node.js'

- task: Npm@1
  displayName: 'npm install'
  inputs:
    command: custom
    verbose: false
    customCommand: 'install'

- task: Npm@1
  displayName: 'npm build (v5)'
  env:
    REACT_APP_HAZZAT_CONTENT_BASE_URL: 'https://d1zhmhuei1bwco.cloudfront.net'
  inputs:
    command: 'custom'
    verbose: false
    customCommand: 'run build'

- task: Npm@1
  displayName: 'Unit Tests'
  inputs:
    command: 'custom'
    verbose: false
    customCommand: 'run test-unit -- --coverage --coverageReporters=cobertura --coverageReporters=lcov --coverageReporters=text'

- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/junit.xml'
    failTaskOnFailedTests: true
    failTaskOnFailureToPublishResults: true
    failTaskOnMissingResultsFile: true

- task: UseDotNet@2
  displayName: 'Install .NET for coverage publishing'
  condition: succeededOrFailed()
  inputs:
    packageType: 'sdk'
    version: '8.x'

- task: PublishCodeCoverageResults@2
  condition: succeededOrFailed()
  inputs:
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
    pathToSources: '$(System.DefaultWorkingDirectory)'
    failIfCoverageEmpty: true

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: 'build'
    ArtifactName: 'HazzatWebBuildDev'
    publishLocation: 'Container'