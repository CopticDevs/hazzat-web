# Migration scaffold for #274. See docs/azure-release-migration.md.
# No automatic triggers; even a manual inspection cannot deploy.
trigger: none
pr: none

parameters:
- name: inspectArtifact
  displayName: Inspect a selected PPE build (deployment remains blocked)
  type: boolean
  default: false
- name: buildId
  displayName: Existing successful PPE build ID (not a build number)
  type: string
  default: '0'

pool:
  vmImage: ubuntu-26.04

stages:
- stage: InspectArtifact
  displayName: Verify the selected existing PPE artifact
  condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'), ${{ eq(parameters.inspectArtifact, true) }})
  jobs:
  - job: Inspect
    steps:
    - checkout: self
      persistCredentials: false
    - bash: python3 scripts/verify-ppe-release-build.py
      displayName: Reject invalid, failed, or unrelated build runs
      env:
        PPE_BUILD_ID: ${{ parameters.buildId }}
    - task: DownloadBuildArtifacts@1
      displayName: Download the exact selected build artifact
      inputs:
        buildType: specific
        project: c3ad63de-5431-426e-8009-fe5331eea17a
        pipeline: '14'
        specificBuildWithTriggering: false
        buildVersionToDownload: specific
        buildId: ${{ parameters.buildId }}
        downloadType: single
        artifactName: HazzatWebBuildPpe
        downloadPath: $(Pipeline.Workspace)/ppe-release/_CopticDevs.hazzat-web-ppe
        cleanDestinationFolder: true
    - bash: |
        set -euo pipefail
        test -s "$ARTIFACT_ROOT/index.html"
        test -d "$ARTIFACT_ROOT/static"
        cd "$ARTIFACT_ROOT"
        find . -type f -print0 | sort -z | xargs -0 sha256sum > "$MANIFEST"
        echo 'Verified static output; no build or transformation performed.'
      displayName: Check output layout and record file hashes
      env:
        ARTIFACT_ROOT: $(Pipeline.Workspace)/ppe-release/_CopticDevs.hazzat-web-ppe/HazzatWebBuildPpe
        MANIFEST: $(Pipeline.Workspace)/ppe-artifact-sha256.txt
    - task: PublishPipelineArtifact@1
      displayName: Preserve inspection evidence (not a replacement build artifact)
      inputs:
        targetPath: $(Pipeline.Workspace)/ppe-artifact-sha256.txt
        artifact: ppe-artifact-inspection

# Intentional literal block. No queue-time parameter or variable unlocks deployment.
# Before removing it, replace this job with a deployment job bound to the verified,
# pre-created Azure environment and its reviewed checks/security. See the runbook.
- stage: DeployPpe
  displayName: BLOCKED - target and access-control inventory required
  dependsOn: InspectArtifact
  condition: and(succeeded(), eq(1, 0))
  jobs:
  - job: BlockedDeployment
    steps:
    - checkout: none
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: specific
        project: c3ad63de-5431-426e-8009-fe5331eea17a
        pipeline: '14'
        specificBuildWithTriggering: false
        buildVersionToDownload: specific
        buildId: ${{ parameters.buildId }}
        downloadType: single
        artifactName: HazzatWebBuildPpe
        downloadPath: $(Pipeline.Workspace)/ppe-release/_CopticDevs.hazzat-web-ppe
        cleanDestinationFolder: true
    - task: AzureStaticWebApp@0
      displayName: 'Static Web App: hazzat-web-ppe (blocked)'
      inputs:
        cwd: $(Pipeline.Workspace)/ppe-release
        app_location: _CopticDevs.hazzat-web-ppe/HazzatWebBuildPpe
        app_build_command: ''
        output_location: ''
        api_location: ''
        api_build_command: ''
        routes_location: ''
        config_file_location: ''
        skip_app_build: true
        skip_api_build: false
        is_static_export: false
        verbose: false
        deployment_environment: ''
        production_branch: ''
        data_api_location: ''
        azure_static_web_apps_api_token: $(deployment_token)
